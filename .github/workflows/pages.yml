name: Build & Deploy to GitHub Pages

# Die Aktionen sind auf einen Commit festgenagelt, nicht auf ein Etikett.
# Ein Etikett wie @v4 zeigt auf das, worauf sein Besitzer es gerade zeigen
# laesst - wer das Konto uebernimmt, laesst bei jedem Deploy fremden Code mit
# pages:write und id-token:write laufen. Ein Commit-Hash laesst sich nicht
# umhaengen.
#
# Aktualisieren (der Kommentar dahinter sagt, welches Etikett gemeint war):
#   gh api repos/actions/checkout/git/ref/tags/v4 -q .object.sha
# und den neuen Hash hier eintragen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      # Der Build erzeugt alle Inhaltsseiten neu aus data/*.json.
      # Die Bilder liegen bereits optimiert im Repo (build/images.py läuft lokal,
      # weil es Netzzugriff auf mahe-online.de und cwebp braucht).
      - name: Build
        env:
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: python3 build/build.py

      # Bricht den Deploy ab, wenn ein Link tot ist, ein canonical nicht stimmt,
      # ein JSON-LD kaputt ist oder eine Sprache Seiten fehlen.
      - name: QA
        run: python3 build/check.py

      # Tiefenpruefung: Ueberschriftenebenen, verwaiste Seiten, NAP-Konsistenz,
      # Uebersetzungsluecken, Alt-Texte, Meta-Dubletten, lang-Attribut.
      - name: Audit
        run: python3 build/audit.py

      - name: Manufacturer data regression check
        run: python3 build/verify_mahe.py

      - name: Frontend regression tests
        run: node --test build/test_frontend.mjs

      - name: Generator regression tests
        run: python3 -m unittest discover -s build -p 'test_*.py'

      - name: Package public files only
        run: python3 build/package_site.py --output "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

  # Bing, Yandex, Seznam und Naver erfahren von einer neuen Seite sonst erst,
  # wenn ihr Crawler das naechste Mal vorbeikommt. IndexNow dreht das um: die
  # Website meldet sich selbst. Google beteiligt sich daran nicht.
  #
  # Gemeldet wird nur, was dieser Push wirklich geaendert hat - nicht jedes Mal
  # der ganze Katalog. Auch geloeschte Adressen werden gemeldet, damit der
  # Crawler ihre Weiterleitung oder den neuen 404-Status abholen kann.
  # indexnow.py teilt grosse Mengen in die erlaubten Protokoll-Batches auf.
  #
  # Der Schritt laeuft NACH dem Deploy: vorher stuenden die neuen Seiten noch
  # gar nicht im Netz und der Dienst holte sich die alte Fassung. Schlaegt er
  # fehl, ist die Website trotzdem live - deshalb continue-on-error.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Die ganze Vorgeschichte: der Vergleichspunkt ist der Stand VOR dem
          # Push, nicht der vorletzte Commit. Bei einem Push mit drei Commits
          # sah "HEAD^" nur den letzten.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Geaenderte Seiten an IndexNow melden
        continue-on-error: true
        env:
          VORHER: ${{ github.event.before }}
        run: |
          set -eu
          # Gemeldet wird, was sich WIRKLICH geaendert hat - nicht, welche
          # Dateien der Build angefasst hat.
          #
          # Vorher stand hier "git diff --name-only HEAD^ HEAD -- '*.html'".
          # Der Build schreibt aber jede Seite neu, sobald sich der ?v=-Stempel
          # von site.css aendert, und das tut er bei jeder CSS-Zeile. Beim Lauf
          # vom 03.09.2026 meldete der Schritt deshalb "348 Seiten geaendert"
          # und schickte den ganzen Katalog - genau das Gegenteil dessen, wofuer
          # er gebaut wurde.
          #
          # build/lastmod.json weiss es besser: dort steht je Seite eine
          # Inhaltskennung, und die aendert sich nur bei echtem Inhalt. Genau
          # diese Datei traegt auch das lastmod der Sitemap.
          python3 - <<'PY' > /tmp/pfade.txt
          import json, os, subprocess, sys
          sys.path.insert(0, "build")
          from indexnow import changed_paths
          def hole(ref):
              r = subprocess.run(["git", "show", f"{ref}:build/lastmod.json"],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  return None
              try:
                  return json.loads(r.stdout)
              except Exception:
                  return None
          vorher = os.environ.get("VORHER", "")
          alt = None
          # Erst die Push-Basis, dann HEAD^ als Rueckfall (workflow_dispatch,
          # erster Commit, force-push mit unbekanntem Vorher).
          for ref in (vorher, "HEAD^"):
              if ref and set(ref) != {"0"}:
                  alt = hole(ref)
                  if alt is not None:
                      break
          neu = json.load(open("build/lastmod.json"))
          if alt is None:
              print("__ALLE__")
              sys.exit(0)
          for pfad in changed_paths(alt, neu):
              print(pfad)
          PY
          n=$(wc -l < /tmp/pfade.txt | tr -d ' ')
          echo "Inhaltlich geaendert: $n Seiten"
          if [ "$(cat /tmp/pfade.txt)" = "__ALLE__" ]; then
            python3 build/indexnow.py
          elif [ "$n" -eq 0 ]; then
            echo "Nichts zu melden."
          else
            sed -n '1,40p' /tmp/pfade.txt
            xargs -a /tmp/pfade.txt python3 build/indexnow.py
          fi
