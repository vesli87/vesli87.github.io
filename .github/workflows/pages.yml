name: Build & Deploy to GitHub Pages

# Die Aktionen sind auf einen Commit festgenagelt, nicht auf ein Etikett.
# Ein Etikett wie @v4 zeigt auf das, worauf sein Besitzer es gerade zeigen
# laesst - wer das Konto uebernimmt, laesst bei jedem Deploy fremden Code mit
# pages:write und id-token:write laufen. Ein Commit-Hash laesst sich nicht
# umhaengen.
#
# Aktualisieren (der Kommentar dahinter sagt, welches Etikett gemeint war):
#   gh api repos/actions/checkout/git/ref/tags/v4 -q .object.sha
# und den neuen Hash hier eintragen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      # Der Build erzeugt alle 247 Seiten neu aus data/*.json.
      # Die Bilder liegen bereits optimiert im Repo (build/images.py läuft lokal,
      # weil es Netzzugriff auf mahe-online.de und cwebp braucht).
      - name: Build
        env:
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: python3 build/build.py

      # Bricht den Deploy ab, wenn ein Link tot ist, ein canonical nicht stimmt,
      # ein JSON-LD kaputt ist oder eine Sprache Seiten fehlen.
      - name: QA
        run: python3 build/check.py

      # Tiefenpruefung: Ueberschriftenebenen, verwaiste Seiten, NAP-Konsistenz,
      # Uebersetzungsluecken, Alt-Texte, Meta-Dubletten, lang-Attribut.
      - name: Audit
        run: python3 build/audit.py

      # Nur ausliefern, was zur Website gehoert.
      #
      # Bisher ging das ganze Repository ins Artefakt: build/*.py, die Rohdaten
      # unter data/, die Dokumentation - und build/source-snapshot.html, 438 kB
      # alter Prototyp aus der Zeit vor dem Generator, unter der echten Domain
      # abrufbar. Geheim ist davon nichts, das Repository ist oeffentlich. Aber
      # eine veraltete Kopie der Seite unter www.ves-tech.ch ist eine Seite,
      # die eine Suchmaschine finden und gegen die echten Seiten stellen kann;
      # robots.txt verbietet nur das Crawlen, nicht das Indexieren.
      #
      # Geloescht wird im Runner, nie im Repository. Was hier verschwindet,
      # wird nach dem Build ohnehin nicht mehr gebraucht.
      - name: Artefakt auf die Website eingrenzen
        run: |
          set -eu
          # Die Kommentare aus site.css gehoeren ins Repository, nicht auf die
          # Leitung. Sie machen 21 % der Datei aus; ausgeliefert sind das
          # 15.8 kB gzip statt 9.5 kB. Geprueft, dass dabei keine Regel
          # verlorengeht: 550 Regeln vorher, 550 nachher, zeichengleich.
          # Der ?v=-Stempel im HTML ist ein Cache-Brecher und keine Pruefsumme,
          # er darf abweichen; ein integrity-Attribut gibt es nicht.
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("assets/css/site.css")
          t = p.read_text("utf-8")
          def regeln(x):
              x = re.sub(r"/\*.*?\*/", "", x, flags=re.S)
              return [" ".join(r.split()) for r in re.findall(r"[^{}]+\{[^{}]*\}", x)]
          vorher = regeln(t)
          k = re.sub(r"/\*.*?\*/", "", t, flags=re.S)
          k = re.sub(r"[ \t]+\n", "\n", k)
          k = re.sub(r"\n{2,}", "\n", k).strip() + "\n"
          assert regeln(k) == vorher, "CSS-Regeln haben sich veraendert - nicht ausliefern"
          p.write_text(k, "utf-8")
          print(f"site.css: {len(t)/1024:.1f} -> {len(k)/1024:.1f} kB, {len(vorher)} Regeln unveraendert")
          PY
          rm -rf build .github
          rm -f CLAUDE.md MASTER_PROMPT.md README.md SECURITY.md
          # data/ enthaelt die Quelldaten des Generators. Oeffentlich gehoeren
          # nur die erzeugten Dateien: products.json ist der Katalog fuer
          # Antwortmaschinen (verlinkt in robots.txt und llms.txt), die
          # search-*.json braucht die Suche im Browser.
          find data -name '*.json' \
            ! -name 'products.json' ! -name 'search-*.json' -delete
          find data -type d -empty -delete
          echo "Ausgeliefert wird aus data/:"
          ls -1 data/

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

  # Bing, Yandex, Seznam und Naver erfahren von einer neuen Seite sonst erst,
  # wenn ihr Crawler das naechste Mal vorbeikommt. IndexNow dreht das um: die
  # Website meldet sich selbst. Google beteiligt sich daran nicht.
  #
  # Gemeldet wird nur, was dieser Push wirklich geaendert hat - nicht jedes Mal
  # der ganze Katalog. Wer bei jedem Deploy 339 unveraenderte Adressen meldet,
  # entwertet das Signal genauso wie eine Sitemap, in der jeden Tag alles neu
  # ist. Ab 250 geaenderten Seiten lohnt die Einzelmeldung nicht mehr, dann
  # geht die Sitemap als Ganzes raus.
  #
  # Der Schritt laeuft NACH dem Deploy: vorher stuenden die neuen Seiten noch
  # gar nicht im Netz und der Dienst holte sich die alte Fassung. Schlaegt er
  # fehl, ist die Website trotzdem live - deshalb continue-on-error.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Geaenderte Seiten an IndexNow melden
        continue-on-error: true
        run: |
          set -eu
          git diff --name-only HEAD^ HEAD -- '*.html' > /tmp/roh.txt || : > /tmp/roh.txt
          # Dateipfad -> Adresse:  produkte/x/index.html -> /produkte/x/
          # 404.html bleibt draussen, die Seite gehoert in keinen Index.
          sed -e '/^404\.html$/d' -e 's#index\.html$##' -e 's#^#/#' /tmp/roh.txt \
            | sort -u > /tmp/pfade.txt
          n=$(wc -l < /tmp/pfade.txt | tr -d ' ')
          echo "Von diesem Push geaendert: $n Seiten"
          if [ "$n" -eq 0 ]; then
            echo "Nichts zu melden."
          elif [ "$n" -gt 250 ]; then
            echo "Mehr als 250 Seiten - die ganze Sitemap geht raus."
            python3 build/indexnow.py
          else
            sed -n '1,40p' /tmp/pfade.txt
            xargs -a /tmp/pfade.txt python3 build/indexnow.py
          fi
